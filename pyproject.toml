[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-scm-agent"
version = "0.1.0"
description = "MCP server that lets Claude Code execute Oracle Fusion Cloud SCM & Procurement configuration and transactions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools]
packages = ["oracle_fusion_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
